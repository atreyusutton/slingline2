<script>
"use strict";
/* ============================================================
   SLINGLINE  -  single-file orbital roguelike
   Sections:
   1 Constants  2 State  3 Audio  4 Input  5 Entities
   6 Modules    7 Worldgen  8 Screens  9 Loop  10 Persistence
   ============================================================ */

/* ---------- 1. CONSTANTS / TUNING ---------- */
const GAME_W = 360, GAME_H = 640;
const COL = {
  bg:'#0a0a1f', starFar:'#2a2a4a', starNear:'#9090d0',
  drone:'#ffffff', droneGlow:'#7ee8fa', tether:'#ffeb70',
  chargeLow:'#ff6b9d', chargePeak:'#ffeb70', mote:'#7ee8fa',
  collapse:'#ff2a5e', ui:'#ffffff', outline:'#000000'
};
// Every feel value lives here.
const TUNING = {
  chargeDuration: 1.0,      // sec to fully charge an orbit
  orbitTightenTime: 1.0,    // sec to shrink to min radius
  minOrbitGap: 20,          // tightest orbit = planet.r + this
  tetherZone: 50,           // grab range past planet radius
  angVelStart: 2.6,         // rad/s at tether-on
  angVelEnd: 5.0,           // rad/s at full charge
  launchMult: 1.05,         // base release velocity multiplier
  perfectBoost: 1.4,        // extra mult on a perfect release
  peakWindowStart: 0.85,    // charge fraction where peak window opens
  overchargeGrace: 0.30,    // sec past full charge before bad ejection
  collapseBaseRate: 15,     // px/sec the wash rises
  collapseSectorScale: 0.05,// +5% rise speed per sector
  cameraLag: 0.10,          // camera lerp factor / frame@60
  cameraOffset: 400,        // drone screen-Y target
  sectorHeight: 3000,       // px climbed per sector
  bandHeight: 200,          // worldgen band size
  maxParticles: 300,
  moteScore: 10, perfectBonus: 50, streakBonus: 100
};
const RARITY = { common:'#ffffff', rare:'#7ea8ff', epic:'#ff8be0' };

/* ---------- 2. STATE ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let gameState = 'menu'; // menu|playing|shop|death|leaderboard|drones|backgrounds|settings|nameentry
let prevState = 'menu';
let save = loadSave();
let run = null;
let now = 0, lastTime = 0;
let shake = { amp:0, time:0, max:0 };
let freezeTime = 0;          // hit-stop seconds
let flash = { color:'#fff', a:0 };
let transition = { active:false, t:0, dur:0.4, to:null, kind:'fade' };
let hotspots = [];           // clickable UI regions, rebuilt each render
let pressedSpot = null;
let paused = false;

/* PulseClock: global synchronized breathing source */
function pulse(freq, phase=0){ return Math.sin(now*Math.PI*2*freq + phase); }

/* seeded RNG (mulberry32) */
function makeRNG(seed){
  let s = seed>>>0;
  return function(){
    s = (s + 0x6D2B79F5)|0;
    let t = Math.imul(s ^ (s>>>15), 1|s);
    t = (t + Math.imul(t ^ (t>>>7), 61|t)) ^ t;
    return ((t ^ (t>>>14))>>>0) / 4294967296;
  };
}

/* ---------- 3. AUDIO ---------- */
let actx = null, masterGain = null;
function initAudio(){
  if(actx) return;
  try{
    actx = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = actx.createGain();
    masterGain.gain.value = save.muted ? 0 : 0.6;
    masterGain.connect(actx.destination);
  }catch(e){ actx=null; }
}
function setMute(m){ save.muted=m; if(masterGain) masterGain.gain.value = m?0:0.6; }
function tone(freqA, freqB, dur, type, vol, slideShape){
  if(!actx || save.muted) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type||'sine';
  const t = actx.currentTime;
  o.frequency.setValueAtTime(freqA, t);
  if(freqB!==freqA) o.frequency.exponentialRampToValueAtTime(Math.max(1,freqB), t+dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol||0.3, t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+dur+0.02);
}
function noiseBurst(dur, vol, sweepFrom){
  if(!actx || save.muted) return;
  const n = Math.floor(actx.sampleRate*dur);
  const buf = actx.createBuffer(1, n, actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++){ d[i] = (Math.random()*2-1)*(1-i/n); }
  const src = actx.createBufferSource(); src.buffer = buf;
  const g = actx.createGain(), f = actx.createBiquadFilter();
  f.type='lowpass';
  const t = actx.currentTime;
  f.frequency.setValueAtTime(sweepFrom||1800, t);
  f.frequency.exponentialRampToValueAtTime(200, t+dur);
  g.gain.setValueAtTime(vol||0.4, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t+dur);
}
const SFX = {
  tetherOn(){ tone(200,200,0.08,'square',0.25); },
  charge(p){ tone(400+p*400,400+p*400,0.05,'sine',0.06); },
  releaseNormal(){ tone(300,300,0.10,'triangle',0.3); },
  releasePerfect(){ tone(600,1200,0.20,'triangle',0.35); setTimeout(()=>tone(900,1400,0.18,'triangle',0.12),60); },
  mote(streak){ tone(500+streak*50,700+streak*50,0.09,'sine',0.25); },
  streak(){ [0,90,180].forEach((d,i)=>setTimeout(()=>tone(500+i*200,700+i*200,0.12,'triangle',0.28),d)); },
  death(){ noiseBurst(0.5,0.5,2400); tone(160,40,0.5,'sawtooth',0.35); tone(70,30,0.6,'sine',0.4); },
  shopOpen(){ [330,415,500].forEach(f=>tone(f,f,0.6,'sine',0.12)); },
  buy(){ tone(500,900,0.15,'square',0.3); },
  tick(p){ tone(800+p*900,800+p*900,0.03,'square',0.05); },
  button(){ tone(420,520,0.06,'square',0.15); },
  newBest(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,f,0.25,'triangle',0.2),i*110)); },
  whoosh(){ noiseBurst(0.3,0.18,900); }
};

/* ---------- 4. INPUT ---------- */
function canvasCoords(e){
  const r = canvas.getBoundingClientRect();
  const px = (e.touches? e.touches[0].clientX : e.clientX);
  const py = (e.touches? e.touches[0].clientY : e.clientY);
  return { x:(px-r.left)/r.width*GAME_W, y:(py-r.top)/r.height*GAME_H };
}
let holding = false;
function onDown(e){
  e.preventDefault();
  initAudio(); if(actx && actx.state==='suspended') actx.resume();
  const p = canvasCoords(e);
  // UI hotspot hit test (works on all screens)
  for(let i=hotspots.length-1;i>=0;i--){
    const h = hotspots[i];
    if(p.x>=h.x && p.x<=h.x+h.w && p.y>=h.y && p.y<=h.y+h.h){
      pressedSpot = h; return;
    }
  }
  if(gameState==='playing' && !paused){ holding = true; attemptTether(); }
}
function onUp(e){
  e.preventDefault();
  const p = canvasCoords(e);
  if(pressedSpot){
    if(p.x>=pressedSpot.x-4 && p.x<=pressedSpot.x+pressedSpot.w+4 &&
       p.y>=pressedSpot.y-4 && p.y<=pressedSpot.y+pressedSpot.h+4){
      SFX.button(); pressedSpot.fn();
    }
    pressedSpot = null; return;
  }
  if(gameState==='playing' && !paused && holding){ holding=false; releaseTether(); }
}
canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, {passive:false});
canvas.addEventListener('touchend', onUp, {passive:false});
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) paused = (gameState==='playing'); });

/* button helper */
function uiButton(label, x, y, w, h, fn, opt){
  opt = opt||{};
  const pressed = pressedSpot && pressedSpot._lbl===label;
  hotspots.push({x,y,w,h,fn,_lbl:label});
  const s = pressed?0.94:1;
  const cw = w*s, ch = h*s, cx = x+(w-cw)/2, cy = y+(h-ch)/2;
  ctx.fillStyle = opt.bg || (pressed?'#3a3a6a':'#1a1a3a');
  ctx.fillRect(cx,cy,cw,ch);
  ctx.strokeStyle = opt.border || COL.droneGlow;
  ctx.lineWidth = 2;
  if(opt.pulseBorder){
    const pb = 0.5+0.5*pulse(0.8);
    ctx.strokeStyle = lerpColor(COL.chargeLow, COL.chargePeak, pb);
  }
  ctx.strokeRect(cx+1,cy+1,cw-2,ch-2);
  pixText(label, x+w/2, y+h/2, opt.size||8, opt.color||COL.ui, 'center');
}

/* ---------- text rendering ---------- */
function pixText(str, x, y, size, color, align){
  ctx.font = size+'px "Press Start 2P", monospace';
  ctx.textAlign = align||'left';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 3;
  ctx.strokeStyle = COL.outline;
  ctx.strokeText(str, x, y);
  ctx.fillStyle = color||COL.ui;
  ctx.fillText(str, x, y);
}

/* ---------- color helpers ---------- */
function hexToRgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function lerpColor(a,b,t){
  const A=hexToRgb(a),B=hexToRgb(b);
  const r=Math.round(A[0]+(B[0]-A[0])*t),g=Math.round(A[1]+(B[1]-A[1])*t),bl=Math.round(A[2]+(B[2]-A[2])*t);
  return 'rgb('+r+','+g+','+bl+')';
}
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function lerp(a,b,t){ return a+(b-a)*t; }

/* ---------- 5. ENTITIES ---------- */
class Drone {
  constructor(x,y){
    this.x=x; this.y=y; this.vx=0; this.vy=-40;
    this.state='free'; this.angle=-Math.PI/2;
    this.orbitPlanet=null; this.orbitR=0; this.orbitAng=0; this.orbitVel=0;
    this.charge=0; this.overcharge=0; this.chargeSegs=0;
    this.r=4; this.trail=[]; this.perfectTrail=0;
    this.stretch=0; this.phaseTime=0;
    this.history=[]; // for echo drone
    this.glow=0;
  }
  tangent(){ // unit tangent in counterclockwise direction
    return { x:-Math.sin(this.orbitAng), y:Math.cos(this.orbitAng) };
  }
  update(dt){
    this.glow = 1 + pulse(1.25)*0.2;
    if(this.phaseTime>0) this.phaseTime-=dt;
    if(this.stretch>0) this.stretch=Math.max(0,this.stretch-dt*10);
    if(this.state==='tethered'){
      const p=this.orbitPlanet;
      // charge
      const cd = TUNING.chargeDuration * run.chargeRateMult;
      this.charge = Math.min(1, this.charge + dt/cd);
      if(this.charge>=1) this.overcharge += dt;
      // tighten orbit + speed up
      const tt = Math.min(1, this.charge);
      const minR = p.r + TUNING.minOrbitGap;
      this.orbitR = lerp(this.startR, minR, tt);
      this.orbitVel = lerp(TUNING.angVelStart, TUNING.angVelEnd, tt) * this.angVelMult;
      this.orbitAng += this.orbitVel*dt;
      this.x = p.x + Math.cos(this.orbitAng)*this.orbitR;
      this.y = p.y + Math.sin(this.orbitAng)*this.orbitR;
      const tg=this.tangent();
      this.angle = Math.atan2(tg.y,tg.x);
      // charge tick segments
      const segs = Math.floor(this.charge*16);
      if(segs>this.chargeSegs){ this.chargeSegs=segs; SFX.tick(this.charge); SFX.charge(this.charge); }
      // overcharge ejection
      if(this.overcharge > TUNING.overchargeGrace){ releaseTether(true); }
    } else {
      this.x += this.vx*dt;
      this.y += this.vy*dt;
      this.angle = Math.atan2(this.vy,this.vx);
    }
    // trail
    this.trail.push({x:this.x,y:this.y,a:1});
    if(this.trail.length>22) this.trail.shift();
    for(const t of this.trail) t.a -= dt*1.6;
    if(this.perfectTrail>0) this.perfectTrail-=dt;
    // history for echo
    this.history.push({x:this.x,y:this.y});
    if(this.history.length>30) this.history.shift();
  }
  speed(){ return Math.hypot(this.vx,this.vy); }
}

class Planet {
  constructor(x,y,r,type){
    this.x=x; this.y=y; this.r=r; this.type=type;
    this.phase=Math.random()*Math.PI*2;
    this.ringAng=Math.random()*Math.PI*2;
    this.craters=[];
    const n = 1+Math.floor(Math.random()*2);
    for(let i=0;i<n;i++) this.craters.push({a:Math.random()*6.28,d:Math.random()*0.5+0.2,r:r*0.16});
    this.firstOrbit=true;
    this.baseCol = type==='small'?'#ff6b9d':type==='large'?'#7ea8ff':type==='pulsar'?'#ffeb70':'#b07eea';
    this.pulsarT=0;
  }
  zoneR(){
    let z = this.r + TUNING.tetherZone + run.tetherBonus;
    if(this.type==='pulsar'){
      const e = 0.5+0.5*Math.sin(this.pulsarT*Math.PI*2/1.5);
      z = this.r + 12 + e*(TUNING.tetherZone+run.tetherBonus);
    }
    return z;
  }
  catchable(){
    if(this.type!=='pulsar') return true;
    return Math.sin(this.pulsarT*Math.PI*2/1.5) > 0.2;
  }
  update(dt){
    this.ringAng += dt*(Math.PI*2/6);
    if(this.type==='pulsar') this.pulsarT+=dt;
  }
}

class Mote {
  constructor(x,y){ this.x=x;this.y=y;this.rot=Math.random()*6.28;this.alive=true;this.sparkT=0; }
  update(dt){
    this.rot += dt*1.5;
    this.sparkT-=dt;
    if(this.sparkT<=0){ this.sparkT=0.5; spawnParticle(this.x,this.y,(Math.random()-0.5)*20,(Math.random()-0.5)*20,0,0,0.4,1,1,COL.mote,COL.mote,'diamond'); }
    if(hasModule('magnet') && run.drone){
      const dx=run.drone.x-this.x, dy=run.drone.y-this.y, d=Math.hypot(dx,dy);
      if(d<60 && d>1){ this.x+=dx/d*120*dt; this.y+=dy/d*120*dt; }
    }
  }
}

/* particle pool */
const particles = [];
for(let i=0;i<TUNING.maxParticles;i++) particles.push({active:false});
function spawnParticle(x,y,vx,vy,ax,ay,life,s0,s1,c0,c1,shape,rot,rotV){
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    if(!p.active){
      p.active=true;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.ax=ax||0;p.ay=ay||0;
      p.life=life;p.maxLife=life;p.s0=s0;p.s1=s1;p.c0=c0;p.c1=c1;
      p.shape=shape||'square';p.rot=rot||0;p.rotV=rotV||0;
      return;
    }
  }
}
function burst(x,y,n,spd,c0,c1,shape,lifeMin){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.28, s=spd*(0.4+Math.random()*0.6);
    spawnParticle(x,y,Math.cos(a)*s,Math.sin(a)*s,0,0,(lifeMin||0.4)+Math.random()*0.4,
      2+Math.random()*2,0,c0,c1,shape||'square',Math.random()*6.28,(Math.random()-0.5)*6);
  }
}
function updateParticles(dt){
  for(const p of particles){
    if(!p.active) continue;
    p.life-=dt;
    if(p.life<=0){ p.active=false; continue; }
    p.vx+=p.ax*dt; p.vy+=p.ay*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.rot+=p.rotV*dt;
  }
}
function drawParticles(camY){
  for(const p of particles){
    if(!p.active) continue;
    const t=1-p.life/p.maxLife;
    const sz=lerp(p.s0,p.s1,t);
    const sy=p.y-camY;
    if(sy<-20||sy>GAME_H+20) continue;
    ctx.globalAlpha=clamp(p.life/p.maxLife,0,1);
    ctx.fillStyle=lerpColor(p.c0,p.c1,t);
    ctx.save(); ctx.translate(p.x,sy); ctx.rotate(p.rot);
    if(p.shape==='diamond'){ ctx.rotate(Math.PI/4); ctx.fillRect(-sz/2,-sz/2,sz,sz); }
    else if(p.shape==='circle'){ ctx.beginPath();ctx.arc(0,0,sz/2,0,6.28);ctx.fill(); }
    else if(p.shape==='triangle'){ ctx.beginPath();ctx.moveTo(0,-sz);ctx.lineTo(sz,sz);ctx.lineTo(-sz,sz);ctx.closePath();ctx.fill(); }
    else ctx.fillRect(-sz/2,-sz/2,sz,sz);
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

/* number popups */
const popups=[];
function popup(text,x,y,color){ popups.push({text,x,y,color:color||COL.ui,life:0.7,max:0.7}); }
function updatePopups(dt){
  for(let i=popups.length-1;i>=0;i--){
    const p=popups[i]; p.life-=dt; p.y-=28*dt;
    if(p.life<=0) popups.splice(i,1);
  }
}
function drawPopups(camY){
  for(const p of popups){
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    pixText(p.text,p.x,p.y-camY,7,p.color,'center');
  }
  ctx.globalAlpha=1;
}

/* ---------- 6. MODULE SYSTEM ---------- */
// each module: id,name,rarity,cost,desc + optional hooks
const MODULES = [
  { id:'phantom', name:'PHANTOM TETHER', rarity:'common', cost:8,

  { id:'greed', name:'GREED DRIVE', rarity:'common', cost:6,
    desc:'Motes worth 2x. Collapse 8% faster.' },
  { id:'coldstart', name:'COLD START', rarity:'common', cost:7,
    desc:'First orbit on a planet +30% speed',
    onTether(p){ if(p.firstOrbit){ run.drone.angVelMult*=1.3; } } },
  { id:'magnet', name:'MAGNET COIL', rarity:'common', cost:8,
    desc:'Motes pull toward you from 60px' },
  { id:'slowbleed', name:'SLOW BLEED', rarity:'rare', cost:12,
    desc:'Collapse rises 15% slower' },
  { id:'pstreak', name:'PERFECT STREAK', rarity:'rare', cost:14,
    desc:'Each consecutive perfect +25% velocity',
    onRelease(perfect){
      if(perfect){ run.perfectStreak++; }
      else run.perfectStreak=0;
    } },
  { id:'longcharge', name:'LONG CHARGE', rarity:'rare', cost:10,
    desc:'Peak window is 2x wider' },
  { id:'echo', name:'ECHO DRONE', rarity:'rare', cost:13,
    desc:'Ghost drone collects motes you miss' },
  { id:'twin', name:'TWIN TETHER', rarity:'epic', cost:20,
    desc:'Tether the 2 nearest planets at once' },
  { id:'bigbang', name:'BIG BANG', rarity:'epic', cost:22,
    desc:'One revive per run w/ shockwave',
    onDeath(){ if(!run.flags.revivedUsed){ run.flags.revivedUsed=true; return true; } return false; } },
  { id:'hoarder', name:'HOARDER', rarity:'epic', cost:18,
    desc:'+1 mote per second while tethered',
    onTick(dt){ if(run.drone.state==='tethered'){ run.flags.hoardT=(run.flags.hoardT||0)+dt;
      if(run.flags.hoardT>=1){ run.flags.hoardT-=1; run.motes++; popup('+1',run.drone.x,run.drone.y-14,COL.mote); } } } },
  { id:'singularity', name:'SINGULARITY', rarity:'epic', cost:25,
    desc:'Black hole each sector: kills, +200 if orbited' }
];
function moduleById(id){ return MODULES.find(m=>m.id===id); }
function hasModule(id){ return run && run.activeModules.some(m=>m.id===id); }
function fireHook(name, arg){
  if(!run) return false;
  let res=false;
  for(const m of run.activeModules){ if(m[name]){ if(m[name](arg)) res=true; } }
  return res;
}

/* ---------- DRONES (characters) ---------- */
const DRONES = [
  { id:'standard', name:'STANDARD', cost:0, color:'#ffffff', glow:COL.droneGlow, shape:'std',
    desc:'Balanced. No perks.' },
  { id:'sparrow', name:'SPARROW', cost:80, color:'#9affc8', glow:'#9affc8', shape:'narrow',
    desc:'Charge +25% faster, top speed -10%' },
  { id:'anchor', name:'ANCHOR', cost:150, color:'#ffcf6b', glow:'#ffcf6b', shape:'wide',
    desc:'Tether zone +20px, launch -10%' },
  { id:'phase', name:'PHASE', cost:250, color:'#c89aff', glow:'#c89aff', shape:'phase',
    desc:'One free planet phase per sector' },
  { id:'coin', name:'COIN', cost:400, color:'#ffeb70', glow:'#ffeb70', shape:'std',
    desc:'+1 mote per planet, -10 collapse buffer' }
];
function droneById(id){ return DRONES.find(d=>d.id===id); }

/* ---------- BACKGROUNDS ---------- */
const BACKGROUNDS = [
  { id:'void', name:'VOID', cost:0 },
  { id:'nebula', name:'NEBULA', cost:50 },
  { id:'aurora', name:'AURORA', cost:120 },
  { id:'crimson', name:'CRIMSON', cost:200 },
  { id:'vapor', name:'VAPOR', cost:350 }
];

/* ---------- 7. WORLD GEN ---------- */
function generateBands(run, upToY){
  // generate planets/motes for bands until band tops are above upToY
  while(run.genTopY > upToY){
    const bandTop = run.genTopY - TUNING.bandHeight;
    const rng = run.rng;
    const count = 1 + Math.floor(rng()*3);
    const placed=[];
    for(let i=0;i<count;i++){
      let tries=0, px, py, ok;
      do{
        px = 40 + rng()*(GAME_W-80);
        py = bandTop + rng()*TUNING.bandHeight;
        ok=true;
        for(const q of placed.concat(run.planets.slice(-6))){
          if(Math.hypot(q.x-px,q.y-py) < 80) { ok=false; break; }
        }
        tries++;
      } while(!ok && tries<12);
      if(!ok) continue;
      // type weighting
      const roll=rng();
      let type='standard', r;
      if(roll<0.20){ type='small'; r=12+rng()*6; }
      else if(roll<0.35){ type='large'; r=32+rng()*16; }
      else if(roll<0.40 && run.sector>3){ type='pulsar'; r=20; }
      else { type='standard'; r=18+rng()*14; }
      const pl=new Planet(px,py,r,type);
      placed.push(pl); run.planets.push(pl);
    }
    // motes in gaps
    const mc = 2+Math.floor(rng()*3);
    for(let i=0;i<mc;i++){
      const mx=30+rng()*(GAME_W-60), my=bandTop+rng()*TUNING.bandHeight;
      let ok=true;
      for(const q of placed){ if(Math.hypot(q.x-mx,q.y-my)<q.r+14){ ok=false;break; } }
      if(ok) run.motesList.push(new Mote(mx,my));
    }
    run.genTopY = bandTop;
  }
}

/* ---------- RUN LIFECYCLE ---------- */
function startRun(){
  const seed = Date.now();

  run = {

    flags:{}, genTopY:200, drone:null,
    cameraY:0, collapseY:0, collapseRate:TUNING.collapseBaseRate,
    chargeRateMult:1, tetherBonus:0,
    blackhole:null, echoIdx:0,
    deathT:0, deathX:0, deathY:0, zoomT:1, zoomTarget:1,
    bestThisRun:false, nameQualified:false
  };
  // drone perks
  let startY=0;
  run.drone = new Drone(GAME_W/2, startY);
  run.drone.angVelMult=1; run.drone.maxSpeedMult=1; run.drone.launchMult2=1;
  if(dr.id==='sparrow'){ run.chargeRateMult=0.75; run.drone.maxSpeedMult=0.9; }
  if(dr.id==='anchor'){ run.tetherBonus=20; run.drone.launchMult2=0.9; }

  run.startY = startY;
  generateBands(run, run.cameraY-400);
  paused=false; holding=false;
  setState('playing');
}

function setState(s){
  prevState = gameState;
  gameState = s;
}

/* ---------- TETHER / RELEASE ---------- */
function attemptTether(){
  const d=run.drone;
  if(d.state==='tethered') return;
  let best=null,bestDist=1e9;
  for(const p of run.planets){
    const dist=Math.hypot(p.x-d.x,p.y-d.y);
    if(dist <= p.zoneR() && dist>p.r+2 && p.catchable()){
      if(dist<bestDist){ bestDist=dist; best=p; }
    }
  }
  if(run.blackhole){
    const b=run.blackhole;
    const dist=Math.hypot(b.x-d.x,b.y-d.y);
    if(dist<b.r+45 && dist>b.r+4 && dist<bestDist){ best=b; bestDist=dist; }
  }
  if(!best) return;
  d.state='tethered'; d.orbitPlanet=best;
  d.orbitR=bestDist; d.startR=bestDist;
  d.orbitAng=Math.atan2(d.y-best.y,d.x-best.x);
  d.charge=0; d.overcharge=0; d.chargeSegs=0;
  d.angVelMult=1;
  fireHook('onTether',best);
  if(best.firstOrbit && save.equippedDrone==='coin'){ run.motes++; popup('+1',d.x,d.y-14,COL.mote); }
  best.firstOrbit=false;
  if(best===run.blackhole && !run.flags.bhScored){
    run.flags.bhScored=true; run.score+=200; popup('+200',d.x,d.y-16,COL.chargePeak);
  }
  SFX.tetherOn();
  burst(d.x,d.y,8,90,COL.droneGlow,best.baseCol||COL.tether,'square',0.4);
  addShake(2,0.12);
  showTutorial(2);
}
function peakWindow(){
  let s=TUNING.peakWindowStart;
  if(hasModule('longcharge')) s = 1-(1-s)*2; // 2x wider
  return s;
}
function releaseTether(forced){
  const d=run.drone;
  if(d.state!=='tethered') return;
  const inPeak = d.charge>=peakWindow() && d.charge<=1.001 && d.overcharge<=TUNING.overchargeGrace;
  const perfect = inPeak && !forced;
  const tg=d.tangent();
  let spd = d.orbitVel*d.orbitR*TUNING.launchMult*d.maxSpeedMult*d.launchMult2;
  if(perfect) spd*=TUNING.perfectBoost;
  if(forced) spd*=0.75; // botched ejection
  if(hasModule('pstreak') && run.perfectStreak>0) spd*=(1+0.25*run.perfectStreak);
  d.vx=tg.x*spd; d.vy=tg.y*spd;
  d.state='free';
  fireHook('onRelease',perfect);
  if(perfect){
    run.score+=TUNING.perfectBonus;
    flash.color='#ffffff'; flash.a=0.9;
    addShake(4,0.15);
    freezeTime=0.04;
    d.perfectTrail=0.6; d.stretch=0.5;
    SFX.releasePerfect();
    popup('PERFECT!',d.x,d.y-18,COL.chargePeak);
    burst(d.x,d.y,14,160,COL.chargePeak,COL.tether,'square',0.5);
    vibrate(10);
  } else {
    SFX.releaseNormal();
    burst(d.x,d.y,6,80,COL.droneGlow,COL.tether,'square',0.3);
  }
  d.orbitPlanet=null;
  showTutorial(3);
}

/* ---------- death ---------- */
function killDrone(){
  if(run.deathT>0) return;
  // module revive?
  if(fireHook('onDeath')){
    // big bang revive
    const d=run.drone;
    burst(d.x,d.y,40,260,'#ffffff',COL.collapse,'circle',0.7);
    addShake(10,0.4); flash.color='#fff'; flash.a=1;
    run.shockwave={x:d.x,y:d.y,r:0,max:260};
    // clear nearby planets
    run.planets=run.planets.filter(p=>Math.hypot(p.x-d.x,p.y-d.y)>120);
    d.state='free'; d.vx*=0.3; d.vy=-220;
    run.collapseY+=160; // push collapse down
    popup('REVIVE!',d.x,d.y-20,COL.chargePeak);
    return;
  }
  const d=run.drone;
  run.deathT=0.001;
  run.deathX=d.x; run.deathY=d.y;
  freezeTime=0.18;
  flash.color='#ffffff'; flash.a=1;
  addShake(14,0.6);
  SFX.death();
  vibrate(50);
  // explosion particles
  for(let i=0;i<28;i++){
    const a=Math.random()*6.28,s=80+Math.random()*200;
    const c0=[COL.drone,COL.droneGlow,'#ffcf6b','#ff8b3a'][Math.floor(Math.random()*4)];
    spawnParticle(d.x,d.y,Math.cos(a)*s,Math.sin(a)*s,0,140,0.5+Math.random()*0.6,
      1+Math.random()*3,0,c0,COL.collapse,'square',Math.random()*6.28,(Math.random()-0.5)*10);
  }
  // triangular debris
  run.debris=[];
  for(let i=0;i<8;i++){
    const a=Math.random()*6.28,s=40+Math.random()*90;
    run.debris.push({x:d.x,y:d.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      rot:Math.random()*6.28,rotV:(Math.random()-0.5)*8,life:1.2});
  }
  run.shockwave={x:d.x,y:d.y,r:0,max:200};
  run.zoomTarget=0.55;
  // score / fragments
  run.fragmentsEarned=Math.floor(run.score/500);
  save.fragments+=run.fragmentsEarned;
  if(run.score>save.highScore){ save.highScore=run.score; run.bestThisRun=true; SFX.newBest(); }
  // leaderboard qualification
  const lb=save.leaderboard;
  run.nameQualified = lb.length<10 || run.score>lb[lb.length-1].score;
  saveSave();
}

/* ---------- shake / fx ---------- */
function addShake(amp,time){ shake.amp=Math.max(shake.amp,amp*save.shakeIntensity); shake.max=shake.amp; shake.time=time; }
function vibrate(ms){ if(!save.muted && navigator.vibrate) try{navigator.vibrate(ms);}catch(e){} }

/* ---------- tutorial ---------- */
let tutorialStep = 0; // 0 none, shows 1..3
function showTutorial(step){
  if(save.tutorialDone) return;
  if(step===1 && tutorialStep===0) tutorialStep=1;
  if(step===2 && tutorialStep===1) tutorialStep=2;
  if(step===3 && tutorialStep===2){ tutorialStep=0; save.tutorialDone=true; saveSave(); }
}

   8. SCREEN RENDERERS
   ============================================================ */

/* --- starfield (persistent, parallax) --- */
const starsFar=[], starsNear=[];
for(let i=0;i<60;i++) starsFar.push({x:Math.random()*GAME_W,y:Math.random()*GAME_H,s:1});
for(let i=0;i<40;i++) starsNear.push({x:Math.random()*GAME_W,y:Math.random()*GAME_H,s:Math.random()<0.5?1:2,tw:Math.random()});

function bgBaseColor(sector){
  // hue drift + sector warming
  const drift = 0.5+0.5*Math.sin(now*Math.PI*2/30);
  let r=10+drift*8, g=10+drift*4, b=31+drift*6;
  const warm=clamp((sector-1)*0.12,0,0.7);
  r+=warm*60; b-=warm*10; g-=warm*4;
  return 'rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')';
}

function drawBackground(camY, sector){
  const bg = save.equippedBackground;
  ctx.fillStyle = bgBaseColor(sector);
  ctx.fillRect(0,0,GAME_W,GAME_H);
  // background-specific layer
  if(bg==='nebula'){
    for(let i=0;i<5;i++){
      const t=now*0.04+i;
      const x=GAME_W/2+Math.sin(t)*120, y=((i*150 - camY*0.15)% (GAME_H+200))-100+GAME_H*0;
      const yy=((i*160 + now*8)%(GAME_H+240))-120;
      const grad=ctx.createRadialGradient(x,yy,0,x,yy,90+Math.sin(t)*20);
      grad.addColorStop(0,'rgba(200,80,200,0.18)');
      grad.addColorStop(1,'rgba(200,80,200,0)');
      ctx.fillStyle=grad; ctx.fillRect(0,0,GAME_W,GAME_H);
    }
  } else if(bg==='aurora'){
    for(let b=0;b<3;b++){
      ctx.beginPath();
      for(let x=0;x<=GAME_W;x+=8){
        const y=120+b*120+Math.sin(x*0.03+now*1.2+b)*30 - (camY*0.1%GAME_H);
        if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      ctx.lineTo(GAME_W,GAME_H); ctx.lineTo(0,GAME_H); ctx.closePath();
      const a=0.10+0.06*Math.sin(now*2+b);
      ctx.fillStyle='rgba('+(60+b*20)+',230,'+(180-b*30)+','+a+')';
      ctx.fill();
    }
  } else if(bg==='crimson'){
    ctx.fillStyle='rgba(60,8,12,0.5)'; ctx.fillRect(0,0,GAME_W,GAME_H);
    if(Math.sin(now*0.6)>0.985){
      ctx.fillStyle='rgba(255,80,60,0.25)'; ctx.fillRect(0,0,GAME_W,GAME_H);
    }
  } else if(bg==='vapor'){
    // synthwave sun
    const sx=GAME_W/2, sy=GAME_H*0.42;
    const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,80);
    sg.addColorStop(0,'rgba(255,120,200,'+(0.5+0.2*pulse(0.5))+')');
    sg.addColorStop(1,'rgba(255,120,200,0)');
    ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(sx,sy,80,Math.PI,0); ctx.fill();
    // grid
    ctx.strokeStyle='rgba(255,80,200,0.4)'; ctx.lineWidth=1;
    const hor=GAME_H*0.55;
    for(let i=0;i<10;i++){
      const t=((i*40 + now*60)%400)/400;
      const y=hor+t*t*GAME_H*0.6;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(GAME_W,y); ctx.stroke();
    }
    for(let i=-6;i<=6;i++){
      ctx.beginPath(); ctx.moveTo(GAME_W/2+i*10,hor);
      ctx.lineTo(GAME_W/2+i*120,GAME_H); ctx.stroke();
    }
  } else {
    // void: faint drifting clouds
    for(let i=0;i<3;i++){
      const y=((i*260 + now*10)%(GAME_H+200))-100;
      const grad=ctx.createRadialGradient(GAME_W/2,y,0,GAME_W/2,y,140);
      grad.addColorStop(0,'rgba(50,40,90,0.15)');
      grad.addColorStop(1,'rgba(50,40,90,0)');
      ctx.fillStyle=grad; ctx.fillRect(0,0,GAME_W,GAME_H);
    }
  }
  // stars far (drift)
  ctx.fillStyle=COL.starFar;
  for(const s of starsFar){
    let y=(s.y - camY*0.2 + now*4)%GAME_H; if(y<0) y+=GAME_H;
    ctx.fillRect(s.x|0,y|0,1,1);
  }
  // stars near (parallax + twinkle)
  for(const s of starsNear){
    let y=(s.y - camY*0.5)%GAME_H; if(y<0) y+=GAME_H;
    s.tw+= (Math.random()<0.04)?Math.random():0;
    const a = 0.5+0.5*Math.sin(now*3+s.tw*10);
    ctx.globalAlpha=a; ctx.fillStyle=COL.starNear;
    ctx.fillRect(s.x|0,y|0,s.s,s.s);
  }
  ctx.globalAlpha=1;
}

/* --- ship drawing --- */
function drawShip(x,y,angle,droneDef,glow,stretch,perfectTrail){
  ctx.save();
  ctx.translate(x,y); ctx.rotate(angle);
  const sh=droneDef.shape;
  let len=6, wid=4;
  if(sh==='narrow'){ len=8; wid=3; }
  if(sh==='wide'){ len=5; wid=6; }
  const sx=1+(stretch||0);
  ctx.scale(sx,1/(1+(stretch||0)*0.3));
  // engine flame flicker
  const flick = (Math.floor(now*12)%2===0);
  const flameLen = (perfectTrail>0?7:4) * (1+(stretch||0));
  ctx.fillStyle = flick?COL.droneGlow:COL.chargePeak;
  ctx.beginPath();
  ctx.moveTo(-len,-wid*0.5); ctx.lineTo(-len-flameLen,0); ctx.lineTo(-len,wid*0.5);
  ctx.closePath(); ctx.fill();
  // glow rim
  ctx.globalAlpha=0.5*(glow||1);
  ctx.fillStyle=droneDef.glow;
  ctx.beginPath();
  ctx.moveTo(len+2,0); ctx.lineTo(-len-1,-wid-1.5); ctx.lineTo(-len-1,wid+1.5);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha=1;
  // body
  ctx.fillStyle=droneDef.color;
  ctx.beginPath();
  ctx.moveTo(len,0); ctx.lineTo(-len,-wid); ctx.lineTo(-len,wid);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle=droneDef.glow; ctx.lineWidth=1; ctx.stroke();
  if(sh==='phase'){
    ctx.globalAlpha=0.5; ctx.fillStyle=droneDef.glow;
    ctx.beginPath(); ctx.moveTo(len*0.5,0); ctx.lineTo(-len*0.5,-wid*0.5); ctx.lineTo(-len*0.5,wid*0.5);
    ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
  }
  ctx.restore();
}

/* --- planet drawing --- */
function drawPlanet(p,camY){
  const sy=p.y-camY;
  if(sy<-80||sy>GAME_H+80) return;
  const bright = 1+pulse(0.3,p.phase)*0.1;
  let r=p.r;
  const d=run&&run.drone;
  const charging = d && d.state==='tethered' && d.orbitPlanet===p;
  if(charging) r=p.r*(1+d.charge*0.08);
  // tether zone ring
  const zr=p.zoneR();
  ctx.save();
  ctx.translate(p.x,sy);
  // rotating dashed zone ring
  ctx.strokeStyle = p.type==='pulsar' && !p.catchable() ? 'rgba(255,235,112,0.15)':'rgba(126,232,250,0.35)';
  ctx.lineWidth=1;
  ctx.setLineDash([4,5]);
  ctx.lineDashOffset=-p.ringAng*10;
  ctx.beginPath(); ctx.arc(0,0,zr,0,6.28); ctx.stroke();
  ctx.setLineDash([]);
  if(p.type==='pulsar' && p.catchable()){
    ctx.globalAlpha=0.3+0.3*Math.sin(p.pulsarT*Math.PI*2/1.5);
    ctx.strokeStyle=COL.chargePeak; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,zr,0,6.28); ctx.stroke();
    ctx.globalAlpha=1;
  }
  // body
  const bc=lerpColor('#000000',p.baseCol,clamp(bright,0,1));
  ctx.fillStyle=bc;
  ctx.beginPath(); ctx.arc(0,0,r,0,6.28); ctx.fill();
  // shaded rim
  ctx.strokeStyle=lerpColor(p.baseCol,'#000000',0.5);
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,r-1,0,6.28); ctx.stroke();
  // craters
  ctx.fillStyle=lerpColor(p.baseCol,'#000000',0.55);
  for(const cr of p.craters){
    const wob=cr.a+Math.sin(now*0.5+cr.d)*0.15;
    ctx.beginPath();
    ctx.arc(Math.cos(wob)*cr.d*r,Math.sin(wob)*cr.d*r,cr.r,0,6.28);
    ctx.fill();
  }
  // charge ring (16 chunky segments)
  if(charging){
    const segs=Math.floor(d.charge*16);
    const pw=peakWindow();
    for(let i=0;i<16;i++){
      const a0=-Math.PI/2 + i/16*6.28;
      const a1=a0+6.28/16*0.8;
      const filled = i<segs;
      if(!filled) continue;
      const segCharge=(i+1)/16;
      let c = lerpColor(COL.chargeLow,COL.chargePeak,segCharge);
      if(segCharge>=pw) c=COL.chargePeak;
      // moving highlight
      const hl=(Math.sin(now*6 - i*0.5)+1)/2;
      c=lerpColor(c,'#ffffff',hl*0.4);
      ctx.strokeStyle=c; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(0,0,r+8,a0,a1); ctx.stroke();
    }
    // peak flash
    if(d.charge>=pw){
      ctx.globalAlpha=0.4+0.3*Math.sin(now*14);
      ctx.strokeStyle='#ffffff'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,0,r+8,0,6.28); ctx.stroke();
      ctx.globalAlpha=1;
    }
    // overcharge cracks
    if(d.overcharge>0){
      ctx.strokeStyle=COL.collapse; ctx.lineWidth=2;
      ctx.globalAlpha=d.overcharge/TUNING.overchargeGrace;
      for(let i=0;i<5;i++){
        const a=i/5*6.28;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);
        ctx.lineTo(Math.cos(a)*(r+10),Math.sin(a)*(r+10));
        ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
  }
  ctx.restore();
}

function drawBlackhole(b,camY){
  const sy=b.y-camY;
  ctx.save(); ctx.translate(b.x,sy);
  for(let i=4;i>0;i--){
    ctx.globalAlpha=0.15*i;
    ctx.fillStyle='#5a2a8a';
    ctx.beginPath(); ctx.arc(0,0,b.r+i*5+Math.sin(now*3)*3,0,6.28); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='#000000';
  ctx.beginPath(); ctx.arc(0,0,b.r,0,6.28); ctx.fill();
  ctx.strokeStyle='#ff8be0'; ctx.lineWidth=2;
  ctx.setLineDash([3,4]); ctx.lineDashOffset=now*30;
  ctx.beginPath(); ctx.arc(0,0,b.r+8,0,6.28); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawMote(m,camY){
  const sy=m.y-camY;
  if(sy<-20||sy>GAME_H+20) return;
  const sc=1+0.15*pulse(1.2,m.x);
  ctx.save(); ctx.translate(m.x,sy); ctx.rotate(m.rot); ctx.scale(sc,sc);
  ctx.globalAlpha=0.4;
  ctx.fillStyle=COL.mote;
  ctx.beginPath(); ctx.moveTo(0,-5);ctx.lineTo(5,0);ctx.lineTo(0,5);ctx.lineTo(-5,0);ctx.closePath(); ctx.fill();
  ctx.globalAlpha=1;
  ctx.beginPath(); ctx.moveTo(0,-3);ctx.lineTo(3,0);ctx.lineTo(0,3);ctx.lineTo(-3,0);ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* --- collapse wash --- */
function drawCollapse(camY){
  const topScreen = run.collapseY - camY;
  if(topScreen>GAME_H+80) return;
  // animated color cycle
  const cyc=(Math.sin(now*Math.PI*2/2)+1)/2;
  let base=lerpColor(COL.collapse,'#ff5e2a',cyc<0.5?cyc*2:0);
  if(cyc>=0.5) base=lerpColor('#ff5e2a','#ff2a8e',(cyc-0.5)*2);
  const grad=ctx.createLinearGradient(0,topScreen-80,0,topScreen+40);
  grad.addColorStop(0,'rgba(255,42,94,0)');
  grad.addColorStop(1,base);
  ctx.fillStyle=grad;
  ctx.fillRect(0,topScreen-80,GAME_W,GAME_H-topScreen+120);
  ctx.fillStyle=base;
  ctx.fillRect(0,topScreen,GAME_W,GAME_H-topScreen+80);
  // scrolling noise in the gradient zone
  for(let i=0;i<70;i++){
    const nx=Math.random()*GAME_W;
    const ny=topScreen-80+Math.random()*100;
    ctx.globalAlpha=Math.random()*0.5;
    ctx.fillStyle=Math.random()<0.5?'#ffffff':'#ffeb70';
    ctx.fillRect(nx|0,ny|0,1,1);
  }
  ctx.globalAlpha=1;
}

/* --- playing screen --- */
function renderPlaying(){
  const camY=run.cameraY + shakeOffset();
  drawBackground(camY, run.sector);
  // side walls
  drawSideWalls();
  // planets
  for(const p of run.planets) drawPlanet(p,camY);
  if(run.blackhole) drawBlackhole(run.blackhole,camY);
  // motes
  for(const m of run.motesList) if(m.alive) drawMote(m,camY);
  // particles
  drawParticles(camY);
  // drone trail
  const d=run.drone;
  for(const t of d.trail){
    if(t.a<=0) continue;
    ctx.globalAlpha=clamp(t.a,0,1)*(d.perfectTrail>0?1:0.6);
    ctx.fillStyle=d.perfectTrail>0?COL.chargePeak:COL.droneGlow;
    const s=d.perfectTrail>0?3:2;
    ctx.fillRect((t.x-s/2)|0,(t.y-camY-s/2)|0,s,s);
  }
  ctx.globalAlpha=1;
  // echo drone
  if(hasModule('echo') && d.history.length>0){
    const h=d.history[0];
    ctx.globalAlpha=0.4;
    drawShip(h.x,h.y-camY,d.angle,droneById(save.equippedDrone),0.6,0,0);
    ctx.globalAlpha=1;
  }
  // tether line
  if(d.state==='tethered'){
    ctx.strokeStyle=COL.tether; ctx.lineWidth=1;
    ctx.globalAlpha=0.8;
    ctx.beginPath();
    ctx.moveTo(d.x,d.y-camY);
    ctx.lineTo(d.orbitPlanet.x,d.orbitPlanet.y-camY);
    ctx.stroke();
    ctx.globalAlpha=1;
  }
  // ship
  if(run.deathT===0){
    if(d.phaseTime>0) ctx.globalAlpha=0.5+0.3*Math.sin(now*20);
    drawShip(d.x,d.y-camY,d.angle,droneById(save.equippedDrone),d.glow,d.stretch,d.perfectTrail);
    ctx.globalAlpha=1;
  }
  // debris (during death)
  if(run.debris){
    for(const fr of run.debris){
      if(fr.life<=0) continue;
      ctx.save(); ctx.translate(fr.x,fr.y-camY); ctx.rotate(fr.rot);
      ctx.globalAlpha=clamp(fr.life,0,1);
      ctx.fillStyle=COL.drone;
      ctx.beginPath(); ctx.moveTo(0,-4);ctx.lineTo(3,3);ctx.lineTo(-3,3);ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha=1;
  }
  // shockwave
  if(run.shockwave){
    const sw=run.shockwave;
    ctx.globalAlpha=clamp(1-sw.r/sw.max,0,1);
    ctx.strokeStyle='#ffffff';
    ctx.lineWidth=lerp(6,0,sw.r/sw.max);
    ctx.beginPath(); ctx.arc(sw.x,sw.y-camY,sw.r,0,6.28); ctx.stroke();
    ctx.globalAlpha=1;
  }
  // collapse
  drawCollapse(camY);
  // number popups
  drawPopups(camY);
  // streak tint
  if(run.flags.streakTint>0){
    ctx.globalAlpha=run.flags.streakTint*0.3;
    ctx.fillStyle=COL.chargePeak;
    ctx.fillRect(0,0,GAME_W,GAME_H);
    ctx.globalAlpha=1;
  }
  // HUD
  drawHUD();
  // tutorial
  if(tutorialStep>0) drawTutorial();
}

function drawSideWalls(){
  const d=run.drone;
  for(const side of [0,1]){
    const x=side?GAME_W-1:0;
    const prox=side? (d.x>GAME_W-60?(d.x-(GAME_W-60))/60:0) : (d.x<60?(60-d.x)/60:0);
    ctx.globalAlpha=0.25+clamp(prox,0,1)*0.6;
    ctx.fillStyle=COL.droneGlow;
    ctx.fillRect(x?x-1:0,0,2,GAME_H);
  }
  ctx.globalAlpha=1;
}

function drawModuleIcon(m,cx,cy,sz){
  ctx.save(); ctx.translate(cx,cy);
  ctx.fillStyle=RARITY[m.rarity];
  ctx.globalAlpha=0.25;
  ctx.fillRect(-sz/2,-sz/2,sz,sz);
  ctx.globalAlpha=1;
  ctx.strokeStyle=RARITY[m.rarity]; ctx.lineWidth=1;
  ctx.strokeRect(-sz/2,-sz/2,sz,sz);
  // simple procedural glyph per module
  ctx.fillStyle=RARITY[m.rarity];
  const g=m.id;
  if(g==='phantom'){ ctx.globalAlpha=0.6; ctx.beginPath();ctx.arc(0,0,4,0,6.28);ctx.fill(); ctx.globalAlpha=1; }
  else if(g==='greed'){ ctx.fillRect(-3,-3,6,6); }
  else if(g==='coldstart'){ for(let i=0;i<4;i++){const a=i/4*6.28;ctx.fillRect(Math.cos(a)*4-1,Math.sin(a)*4-1,2,2);} }
  else if(g==='magnet'){ ctx.fillRect(-4,-3,2,6);ctx.fillRect(2,-3,2,6);ctx.fillRect(-4,-3,8,2); }
  else if(g==='slowbleed'){ ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(3,3);ctx.lineTo(-3,3);ctx.closePath();ctx.fill(); }
  else if(g==='pstreak'){ ctx.fillRect(-4,2,2,2);ctx.fillRect(-1,-1,2,2);ctx.fillRect(2,-4,2,2); }
  else if(g==='longcharge'){ ctx.fillRect(-4,-1,8,2); }
  else if(g==='echo'){ ctx.globalAlpha=0.5;ctx.fillRect(-4,-2,4,4);ctx.globalAlpha=1;ctx.fillRect(0,-2,4,4); }
  else if(g==='twin'){ ctx.beginPath();ctx.arc(-2,0,2,0,6.28);ctx.arc(3,0,2,0,6.28);ctx.fill(); }
  else if(g==='bigbang'){ for(let i=0;i<8;i++){const a=i/8*6.28;ctx.fillRect(Math.cos(a)*3-0.5,Math.sin(a)*3-0.5,1,1);} }
  else if(g==='hoarder'){ ctx.fillRect(-3,-3,3,3);ctx.fillRect(1,-3,3,3);ctx.fillRect(-1,1,3,3); }
  else if(g==='singularity'){ ctx.fillStyle='#000';ctx.beginPath();ctx.arc(0,0,3,0,6.28);ctx.fill();ctx.strokeStyle=RARITY[m.rarity];ctx.beginPath();ctx.arc(0,0,5,0,6.28);ctx.stroke(); }
  ctx.restore();
}

/* --- shop --- */
function buildShop(){
  const pool=MODULES.slice();
  const rng=run.rng;
  run.shopCards=[];
  for(let i=0;i<3 && pool.length;i++){
    const idx=Math.floor(rng()*pool.length);
    run.shopCards.push({mod:pool.splice(idx,1)[0],bob:rng()*6.28,bought:false});
  }
  run.shopDone=false;
}
function renderShop(){
  drawBackground(0,run.sector);
  ctx.fillStyle='rgba(8,8,24,0.85)';
  ctx.fillRect(0,0,GAME_W,GAME_H);
  pixText('SECTOR '+(run.sector-1)+' CLEARED', GAME_W/2, 50, 9, COL.chargePeak,'center');
  // mote count
  ctx.fillStyle=COL.mote;
  ctx.save();ctx.translate(GAME_W/2-30,76);ctx.rotate(now);
  ctx.beginPath();ctx.moveTo(0,-5);ctx.lineTo(5,0);ctx.lineTo(0,5);ctx.lineTo(-5,0);ctx.closePath();ctx.fill();
  ctx.restore();
  pixText(String(run.motes), GAME_W/2-16, 76, 9, COL.mote,'left');
  // cards
  const cardW=100,cardH=130,gap=8;
  const totalW=cardW*3+gap*2;
  let x=(GAME_W-totalW)/2;
  for(let i=0;i<run.shopCards.length;i++){
    const c=run.shopCards[i];
    const bob=Math.sin(now*2+c.bob)*2;
    drawShopCard(c,x,110+bob,cardW,cardH);
    x+=cardW+gap;
  }
  // skip
  uiButton('SKIP (+5 MOTES)', GAME_W/2-90, 270, 180, 30, ()=>{
    if(run.shopDone) return;
    run.motes+=5; run.shopDone=true; SFX.buy();
  }, {size:6});
  // continue
  if(run.shopDone){
    uiButton('CONTINUE', GAME_W/2-80, 320, 160, 40, ()=>{
      closeShop();
    }, {pulseBorder:true,size:10});
  }
  // owned modules row
  pixText('ACTIVE MODULES '+run.activeModules.length+'/5', GAME_W/2, GAME_H-70, 6, COL.ui,'center');
  let mx=GAME_W/2-(run.activeModules.length-1)*11;
  for(const m of run.activeModules){ drawModuleIcon(m,mx,GAME_H-44,18); mx+=22; }
}
function drawShopCard(c,x,y,w,h){
  const m=c.mod;
  const rc=RARITY[m.rarity];
  ctx.fillStyle=c.bought?'#102810':'#12122a';
  ctx.fillRect(x,y,w,h);
  // rarity border
  ctx.lineWidth=2;
  if(m.rarity==='epic'){
    const hue=(now*120)%360;
    ctx.strokeStyle='hsl('+hue+',90%,65%)';
  } else if(m.rarity==='rare'){
    ctx.strokeStyle=rc;
    ctx.shadowColor=rc; ctx.shadowBlur=6+pulse(1)*4;
  } else ctx.strokeStyle=rc;
  ctx.strokeRect(x+1,y+1,w-2,h-2);
  ctx.shadowBlur=0;
  // travelling highlight
  drawModuleIcon(m,x+w/2,y+30,28);
  pixText(m.rarity.toUpperCase(),x+w/2,y+52,5,rc,'center');
  // name wrapped
  wrapText(m.name,x+w/2,y+66,w-10,7,6,COL.ui);
  wrapText(m.desc,x+w/2,y+92,w-12,6,5,'#b0b0d0');
  // buy
  if(c.bought){
    pixText('OWNED',x+w/2,y+h-14,7,'#7eff9a','center');
  } else {
    const afford=run.motes>=m.cost && run.activeModules.length<5 && !run.shopDone;
    uiButton(m.cost+' MOTES',x+8,y+h-26,w-16,20,()=>{
      if(!afford) return;
      run.motes-=m.cost; c.bought=true; run.shopDone=true;
      run.activeModules.push(m);
      if(m.id==='greed'){ run.collapseRate*=1.08; }
      if(m.id==='slowbleed'){ run.collapseRate*=0.85; }
      SFX.buy();
      burst(x+w/2,y+h-26,12,120,rc,COL.chargePeak,'square',0.5);
    },{size:6,color:afford?COL.chargePeak:'#666',border:afford?rc:'#444'});
  }
}
function wrapText(str,cx,y,maxW,size,lh,color){
  ctx.font=size+'px "Press Start 2P", monospace';
  const words=str.split(' ');
  let line='',lines=[];
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=w; }
    else line=test;
  }
  if(line) lines.push(line);
  for(let i=0;i<lines.length;i++) pixText(lines[i],cx,y+i*lh*1.6,size,color,'center');
}
function closeShop(){

let deathPanelT=0, deathTypeChars=0;
function renderDeath(){
  // keep world animating behind
  const camY=run.cameraY;
  drawBackground(camY,run.sector);
  drawSideWalls();
  for(const p of run.planets) drawPlanet(p,camY);
  drawParticles(camY);
  // faded run trail
  ctx.globalAlpha=0.4;
  ctx.strokeStyle=COL.droneGlow; ctx.lineWidth=1;
  ctx.beginPath();
  for(let i=0;i<run.drone.trail.length;i++){
    const t=run.drone.trail[i];
    if(i===0) ctx.moveTo(t.x,t.y-camY); else ctx.lineTo(t.x,t.y-camY);
  }
  ctx.stroke();
  ctx.globalAlpha=1;
  drawCollapse(camY);
  // desaturate overlay
  ctx.fillStyle='rgba(40,40,50,0.4)';
  ctx.fillRect(0,0,GAME_W,GAME_H);
  // panel
  deathPanelT=Math.min(1,deathPanelT+0.05);
  const ease = deathPanelT<0.7? deathPanelT/0.7*1.1 : 1.1-(deathPanelT-0.7)/0.3*0.1;
  const pw=300,ph=290;
  const cx=GAME_W/2, cy=230;
  ctx.save();
  ctx.translate(cx,cy); ctx.scale(ease,ease); ctx.translate(-cx,-cy);
  // box
  ctx.fillStyle='rgba(10,10,30,0.96)';
  ctx.fillRect(cx-pw/2,cy-ph/2,pw,ph);
  ctx.strokeStyle=COL.collapse; ctx.lineWidth=2;
  ctx.strokeRect(cx-pw/2,cy-ph/2,pw,ph);
  ctx.strokeStyle=COL.droneGlow;
  ctx.strokeRect(cx-pw/2+4,cy-ph/2+4,pw-8,ph-8);
  // typewriter text
  deathTypeChars+=1.2;
  const lines=[
    {t:'RUN ENDED',c:run.bestThisRun?COL.chargePeak:COL.ui,s:11},
    {t:'SECTOR '+run.sector+' . SCORE '+run.score,c:COL.ui,s:7},
    {t:'MOTES '+run.motes+' . FRAG +'+run.fragmentsEarned,c:COL.mote,s:7}
  ];
  let charBudget=deathTypeChars, ly=cy-ph/2+34;
  for(const ln of lines){
    const shown=ln.t.slice(0,Math.max(0,Math.floor(charBudget)));
    let col=ln.c;
    if(ln.t==='RUN ENDED' && run.bestThisRun){
      col=lerpColor(COL.chargeLow,COL.chargePeak,(Math.sin(now*8)+1)/2);
    }
    pixText(shown,cx,ly,ln.s,col,'center');
    charBudget-=ln.t.length;
    ly+= ln.s>9?30:24;
  }
  if(run.bestThisRun){
    ctx.globalAlpha=0.5+0.5*Math.sin(now*8);
    pixText('NEW BEST!',cx,ly+4,9,lerpColor(COL.tether,COL.mote,(Math.sin(now*6)+1)/2),'center');
    ctx.globalAlpha=1;
    ly+=24;
  }
  ctx.restore();
  // buttons (outside scale so they're stable)
  if(deathPanelT>=1){
    const ap=1+0.05*Math.sin(now*5);
    const aw=80*ap;
    uiButton('AGAIN', GAME_W/2-aw/2, 300, aw, 80*ap, ()=>{
      deathPanelT=0; deathTypeChars=0; startRun();
    }, {pulseBorder:true,size:10});
    uiButton('SHOP', GAME_W/2-130, 400, 80, 28, ()=>{ /* view-only */ }, {size:6});
    uiButton('SCORES', GAME_W/2-44, 400, 88, 28, ()=>{
      if(run.nameQualified) setState('nameentry'); else setState('leaderboard');
    }, {size:6});
    uiButton('MENU', GAME_W/2+50, 400, 80, 28, ()=>{
      maybeRecordScore('AAA'); run=null; setState('menu');
    }, {size:6});
    if(run.nameQualified){
      ctx.globalAlpha=0.7+0.3*Math.sin(now*4);
      pixText('SCORE QUALIFIES - ENTER NAME',GAME_W/2,445,5,COL.chargePeak,'center');
      ctx.globalAlpha=1;
    }
  }
}

    ctx.fillRect(16,y,GAME_W-32,82);

      pixText('EQUIPPED', GAME_W-26, y+18, 6, COL.chargePeak,'right');

    } else {

function wrapTextLeft(str,x,y,maxW,size,color){
  ctx.font=size+'px "Press Start 2P", monospace';
  const words=str.split(' ');
  let line='',ly=y;
  for(const w of words){
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxW && line){ pixText(line,x,ly,size,color,'left'); line=w; ly+=size*1.8; }
    else line=test;
  }
  if(line) pixText(line,x,ly,size,color,'left');
}

function drawBgThumb(id,x,y,w,h){
  ctx.save();
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.fillStyle='#0a0a1f'; ctx.fillRect(x,y,w,h);
  if(id==='nebula'){ ctx.fillStyle='rgba(200,80,200,0.4)'; ctx.beginPath();ctx.arc(x+w/2,y+h/2,30,0,6.28);ctx.fill(); }
  else if(id==='aurora'){ ctx.fillStyle='rgba(60,230,180,0.4)'; ctx.fillRect(x,y+h/2-8,w,16); }
  else if(id==='crimson'){ ctx.fillStyle='rgba(120,20,30,0.7)'; ctx.fillRect(x,y,w,h); }
  else if(id==='vapor'){ ctx.fillStyle='rgba(255,120,200,0.5)';ctx.beginPath();ctx.arc(x+w/2,y+h*0.6,20,Math.PI,0);ctx.fill();
    ctx.strokeStyle='rgba(255,80,200,0.6)';for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(x,y+h*0.6+i*8);ctx.lineTo(x+w,y+h*0.6+i*8);ctx.stroke();} }
  for(let i=0;i<14;i++){ ctx.fillStyle=COL.starNear; ctx.fillRect(x+Math.random()*w|0,y+Math.random()*h|0,1,1); }
  ctx.restore();
  ctx.strokeStyle='#333'; ctx.strokeRect(x,y,w,h);
}

// drag handling for shake slider
canvas.addEventListener('mousemove', dragSlider);
canvas.addEventListener('touchmove', dragSlider, {passive:false});
function dragSlider(e){
  if(gameState!=='settings' || !pressedSpot || pressedSpot._lbl!=='shakeslider') return;
  e.preventDefault();
  const p=canvasCoords(e);
  save.shakeIntensity=clamp((p.x-40)/(GAME_W-80),0,1);
}

/* ============================================================
   9. UPDATE + MAIN LOOP
   ============================================================ */
function updatePlaying(dt){
  const d=run.drone;
  // collapse rate with sector scaling
  let rate=run.collapseRate*(1+(run.sector-1)*TUNING.collapseSectorScale);
  run.collapseY -= rate*dt;
  // update planets / motes near camera
  const viewTop=run.cameraY-300, viewBot=run.cameraY+GAME_H+300;
  for(const p of run.planets){ if(p.y>viewTop&&p.y<viewBot) p.update(dt); }
  for(const m of run.motesList){ if(m.alive && m.y>viewTop && m.y<viewBot) m.update(dt); }
  if(run.blackhole) run.blackhole.update(dt);
  // module per-tick hooks
  fireHook('onTick',dt);
  // drone
  d.update(dt);
  // generate world ahead
  generateBands(run, run.cameraY-600);
  // prune entities the collapse has already swallowed (keeps loops cheap)
  run.flags.pruneT=(run.flags.pruneT||0)+dt;
  if(run.flags.pruneT>1){
    run.flags.pruneT=0;
    const cutoff=run.collapseY+260;
    run.planets=run.planets.filter(p=>p.y<cutoff);
    run.motesList=run.motesList.filter(m=>m.alive && m.y<cutoff);
  }
  // camera follow (never down)
  const target=d.y-TUNING.cameraOffset;
  if(target<run.cameraY) run.cameraY=lerp(run.cameraY,target,1-Math.pow(1-TUNING.cameraLag,dt*60));
  // climbed / sector
  run.climbed=Math.max(run.climbed, run.startY-d.y);
  const newSector=1+Math.floor(run.climbed/TUNING.sectorHeight);
  if(newSector>run.sector){
    run.sector=newSector;
    openShop();
    return;
  }
  // mote collection
  for(const m of run.motesList){
    if(!m.alive) continue;
    if(Math.hypot(m.x-d.x,m.y-d.y)<10){
      collectMote(m,d,false);
    } else if(hasModule('echo') && d.history.length>0){
      const h=d.history[0];
      if(Math.hypot(m.x-h.x,m.y-h.y)<10) collectMote(m,h,true);
    }
  }
  // collisions with planets
  for(const p of run.planets){
    if(p.y<viewTop||p.y>viewBot) continue;
    if(d.state==='tethered' && d.orbitPlanet===p) continue;
    if(Math.hypot(p.x-d.x,p.y-d.y) < p.r+d.r){
      if(d.phaseTime>0) continue; // phasing
      killDrone(); return;
    }
  }
  // blackhole collision (instant kill unless tethered to it)
  if(run.blackhole){
    const b=run.blackhole;
    if(!(d.state==='tethered'&&d.orbitPlanet===b)){
      if(Math.hypot(b.x-d.x,b.y-d.y)<b.r+d.r){ killDrone(); return; }
    }
  }
  // collapse death
  if(d.y>run.collapseY){ killDrone(); return; }
  // side wall death
  if(d.x<2 || d.x>GAME_W-2){ killDrone(); return; }
  // streak tint decay
  if(run.flags.streakTint>0) run.flags.streakTint=Math.max(0,run.flags.streakTint-dt);
  // shockwave
  if(run.shockwave){
    run.shockwave.r+=600*dt;
    if(run.shockwave.r>run.shockwave.max) run.shockwave=null;
  }
  // score from height
  const heightScore=Math.floor(run.climbed/10);
  const prevHeight=run.flags.heightScore||0;
  if(heightScore>prevHeight){
    run.score+= heightScore-prevHeight;
    run.flags.heightScore=heightScore;
  }
  // first-run tutorial: "HOLD to orbit" when near the first planet
  if(!save.tutorialDone && tutorialStep===0 && d.state==='free'){
    for(const p of run.planets){
      if(Math.hypot(p.x-d.x,p.y-d.y) < p.zoneR()+30){ showTutorial(1); break; }
    }
  }
}
function collectMote(m,collector,viaEcho){
  m.alive=false;
  run.moteStreak++;
  let val=TUNING.moteScore;
  let moteGain=1;
  if(hasModule('greed')){ val*=2; moteGain*=2; }
  run.score+=val; run.motes+=moteGain;
  fireHook('onMoteCollect');
  SFX.mote(run.moteStreak);
  popup('+'+val, collector.x, collector.y-12, COL.mote);
  burst(m.x,m.y,4,70,COL.mote,'#ffffff','diamond',0.4);
  if(run.moteStreak>=5){
    run.score+=TUNING.streakBonus;
    run.flags.streakTint=1;
    SFX.streak();
    popup('STREAK +'+TUNING.streakBonus, collector.x, collector.y-26, COL.chargePeak);
    run.moteStreak=0;
  }
}
function openShop(){
  buildShop();
  SFX.shopOpen();
  run.moteStreak=0;
  setState('shop');
}

function updateDeath(dt){
  run.deathT+=dt;
  // debris
  if(run.debris){
    for(const fr of run.debris){
      fr.vx*=0.96; fr.vy*=0.96; fr.vy+=60*dt;
      fr.x+=fr.vx*dt; fr.y+=fr.vy*dt; fr.rot+=fr.rotV*dt;
      fr.life-=dt;
    }
  }
  if(run.shockwave){
    run.shockwave.r+=500*dt;
    if(run.shockwave.r>run.shockwave.max) run.shockwave=null;
  }
  // collapse keeps creeping for ambience
  run.collapseY-=run.collapseRate*dt*0.3;
  // after explosion settle, go to death screen
  if(run.deathT>0.9 && gameState==='playing'){
    setState('death');
    deathPanelT=0; deathTypeChars=0;
    SFX.whoosh();
  }
}

function loop(ts){
  requestAnimationFrame(loop);
  if(!lastTime) lastTime=ts;
  let dt=(ts-lastTime)/1000;
  lastTime=ts;
  dt=Math.min(dt,0.05); // clamp
  now=ts/1000;

  // hit-stop
  if(freezeTime>0){ freezeTime-=dt; dt=0; }

  // shake decay (exponential, frame-rate independent)
  if(shake.amp>0){
    const decayDt=Math.min(0.05,(ts-(loop._lt||ts))/1000);
    shake.amp-=shake.amp*decayDt*6;
    if(shake.amp<0.2) shake.amp=0;
    shakeX=(Math.random()-0.5)*2*shake.amp;
    shakeY=(Math.random()-0.5)*2*shake.amp;
  } else { shakeX=0; shakeY=0; }
  loop._lt=ts;

  // ---- UPDATE ----
  hotspots=[];
  if(gameState==='playing' && !paused && dt>0){
    if(run.deathT>0) updateDeath(dt);
    else updatePlaying(dt);
  }
  if((gameState==='death'||gameState==='nameentry') && run && run.deathT>0 && run.debris){
    // keep debris settling visually
  }
  updateParticles(dt);
  updatePopups(dt);

  // ---- RENDER ----
  ctx.save();
  ctx.translate(Math.round(shakeX),Math.round(shakeY));
  ctx.fillStyle=COL.bg;
  ctx.fillRect(-20,-20,GAME_W+40,GAME_H+40);

  if(gameState==='menu') renderMenu();
  else if(gameState==='playing'){ renderPlaying(); if(paused) renderPauseOverlay(); }
  else if(gameState==='shop') renderShop();
  else if(gameState==='death') renderDeath();
  else if(gameState==='nameentry') renderNameEntry();
  else if(gameState==='leaderboard') renderLeaderboard();
  else if(gameState==='drones') renderDrones();
  else if(gameState==='backgrounds') renderBackgrounds();
  else if(gameState==='settings') renderSettings();

  ctx.restore();

  // screen flash
  if(flash.a>0){
    ctx.globalAlpha=flash.a;
    ctx.fillStyle=flash.color;
    ctx.fillRect(0,0,GAME_W,GAME_H);
    ctx.globalAlpha=1;
    flash.a-=dt>0?dt*4:0.05;
    if(flash.a<0) flash.a=0;
  }
  // chromatic aberration approximation on recent death
  if(run && run.deathT>0 && run.deathT<0.4){
    ctx.globalAlpha=0.25*(1-run.deathT/0.4);
    ctx.globalCompositeOperation='lighten';
    ctx.fillStyle='#ff0000'; ctx.fillRect(-3,0,GAME_W,GAME_H);
    ctx.fillStyle='#0000ff'; ctx.fillRect(3,0,GAME_W,GAME_H);
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
  }
}

/* ---------- 10. PERSISTENCE ---------- */
function loadSave(){
  let s=null;
  try{ s=JSON.parse(localStorage.getItem('slingline')); }catch(e){}
  const def={
    highScore:0, fragments:0,
    ownedDrones:['standard'], equippedDrone:'standard',
    ownedBackgrounds:['void'], equippedBackground:'void',
    leaderboard:[], muted:false, shakeIntensity:1.0, tutorialDone:false
  };
  if(!s) return def;
  for(const k in def) if(s[k]===undefined) s[k]=def[k];
  return s;
}
function saveSave(){
  try{ localStorage.setItem('slingline',JSON.stringify(save)); }catch(e){}
}

/* ---------- resize / scaling ---------- */
function resize(){
  const vw=window.innerWidth, vh=window.innerHeight;
  let scale=Math.min(vw/GAME_W, vh/GAME_H);
  // prefer integer scale when it fits comfortably
  if(scale>=1) scale=Math.floor(scale);
  canvas.style.width=(GAME_W*scale)+'px';
  canvas.style.height=(GAME_H*scale)+'px';
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',resize);
resize();

/* ---------- boot ---------- */
function boot(){
  document.getElementById('loading').style.display='none';
  if(!save.tutorialDone) tutorialStep=0;
  requestAnimationFrame(loop);
}
// wait briefly for font, but never block playability
if(document.fonts && document.fonts.ready){
  Promise.race([document.fonts.ready, new Promise(r=>setTimeout(r,800))]).then(boot);
} else { setTimeout(boot,100); }
